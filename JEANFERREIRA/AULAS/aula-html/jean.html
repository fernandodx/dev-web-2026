<body>
  <header>
    <h1>A Lenda do Tesouro Perdido</h1>
    <p>Uma caça ao tesouro escondido </p>
  </header>

  <main>
    <article class="hero">
      <figure>
        <img
          width="250"
          src="https://m.media-amazon.com/images/M/MV5BMjFmNzJhMWItM2U3ZC00NzA5LWEyNzQtYTQxODdlNmIzZTEyXkEyXkFqcGc@._V1_.jpg">
      

      <div>
        <section>
          <h2>Sobre o filme</h2>
          <p>
            A Lenda do Tesouro Perdido é uma aventura lançada em 2004 e dirigida por Jon Turteltaub.
            Benjamin Gates, um historiador de uma família de caçadores de tesouros, passa a vida
            atrás de um fabuloso tesouro que teria sido escondido pelos pais os Estados Unidos.
          </p>
          <p>
            Quando descobre que a pista final está num dos documentos mais protegidos do país,
            Ben decide agir antes de um grupo rival, e a corrida por charadas históricas
            o leva a monumentos, prédios famosos e arquivos nacionais.
          </p>
        </section>

        <section>
          <h2>Por que eu gosto tanto</h2>
          <p>
            Eu adoro a ideia de transformar a história em algo real onde cada pista
            leva à próxima, e dá vontade de tentar resolver junto com os personagens.
          </p>
          <p>
            Porque eu sempre gostei de filmes com misterio e aventura, ainda mais envolvendo um tesouro escondido.
          </p>
        </section>

        <section>

            <dt>Gênero</dt><dd>Aventura</dd>

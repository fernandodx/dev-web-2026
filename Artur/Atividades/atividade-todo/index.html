<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas — Artur Oliveira</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #191919;
      border-bottom: 2px solid #e53935;
      padding: 25px;
    }

    .container {
      max-width: 850px;
    }

    .painel {
      background-color: #191919;
      border: 1px solid #383838;
      border-radius: 16px;
      padding: 30px;
      margin-top: 40px;
    }

    .destaque {
      color: #ff6659;
    }

    .descricao {
      color: #b8b8b8;
    }

    .form-control {
      background-color: #242424;
      color: #ffffff;
      border: 1px solid #383838;
    }

    .form-control::placeholder {
      color: #b8b8b8;
    }

    .form-control:focus {
      background-color: #242424;
      color: #ffffff;
      border-color: #e53935;
      box-shadow: none;
    }

    .btn-primary {
      background-color: #c62828;
      border-color: #c62828;
    }

    .btn-primary:hover,
    .btn-primary:active {
      background-color: #b71c1c !important;
      border-color: #b71c1c !important;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #242424;
      border: 1px solid #383838;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .todo-item .texto {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .todo-item.concluida .texto {
      text-decoration: line-through;
      color: #999999;
    }

    .btn-outline-success {
      color: #65bc83;
      border-color: #65bc83;
    }

    footer {
      color: #b8b8b8;
      text-align: center;
      margin-top: 35px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1 class="h4 mb-0">
        <span class="destaque">To-do</span> | Lista de Tarefas
      </h1>
    </div>
  </header>

  <main class="container">
    <div class="painel">

      <small class="destaque fw-bold">
        ORGANIZADOR PESSOAL
      </small>

      <h2 class="fw-bold mt-3">
        Minha Lista de Tarefas
      </h2>

      <p class="descricao mb-4">
        Organize sua rotina e acompanhe suas atividades.
      </p>

      <div class="input-group mb-4">
        <input
          type="text"
          id="input-tarefa"
          class="form-control"
          aria-label="Nova tarefa"
          placeholder="Digite uma nova tarefa..."
        >

        <button
          type="button"
          class="btn btn-primary"
          id="btn-adicionar">
          + Adicionar
        </button>
      </div>

      <ul class="list-unstyled" id="lista-tarefas"></ul>

    </div>

    <footer>
      <p>Desenvolvido por Artur Oliveira</p>

      <small>HTML • CSS • Bootstrap • JavaScript</small>

      <div class="mt-3">
        <a href="../../Projeto%20Final/index.html"
          class="btn btn-outline-light btn-sm">
          Voltar ao Portfólio
        </a>
      </div>
    </footer>
  </main>

  <script src="todo.js"></script>

</body>
</html>
